[package]
name = "traceroute"
version = "0.2.0"
edition = "2021"
description = "High-performance traceroute utility with OpenTelemetry distributed tracing"
authors = ["Traceroute Maintainers"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }
etherparse = "0.16"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_yml = { git = "https://github.com/jimmystewpot/serde_yml" }
serde_json = "1.0"
axum = "0.8"
opentelemetry = { version = "0.26", features = ["trace"] }
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.26", features = ["grpc-tonic", "http-proto", "reqwest-client", "tls-roots", "reqwest-rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
anyhow = "1.0"
rand = "0.8"
uuid = { version = "1.10", features = ["v4"] }
hostname = "0.4"
humantime = "2.1"
humantime-serde = "1.1"
libc = "0.2.189"

[[bin]]
name = "traceroute"
path = "src/main.rs"

[lib]
name = "traceroute"
path = "src/lib.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tower = { version = "0.5", features = ["util"] }
